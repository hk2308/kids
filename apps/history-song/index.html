<script>
    /* ===================== きょうつう ===================== */
    const rnd = n => Math.floor(Math.random() * n);
    const pickOne = a => a[rnd(a.length)];
    function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
    function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function resultBox(ok, title, body) {
        return `<div class="pop ${ok ? 'bg-green-50 border-green-300' : 'bg-amber-50 border-amber-300'} border-2 rounded-2xl p-3">
            <p class="font-black ${ok ? 'text-green-700' : 'text-amber-700'}">${title}</p>
            <div class="font-bold text-sm mt-1 leading-relaxed">${body}</div></div>`;
    }
    const S = { quiz: [0, 0] };

    /* 漢字{よみ} を ルビに */
    const RUBY_RE = /([一-鿿々]+)\{([^{}]+)\}/g;
    function rubySkip(el) {
        for (let n = el; n; n = n.parentNode) {
            const tag = n.nodeType === 1 ? n.tagName.toLowerCase() : '';
            if (tag === 'script' || tag === 'style' || tag === 'svg' || tag === 'ruby' || tag === 'input') return true;
        }
        return false;
    }
    function rubifyText(node) {
        const t = node.nodeValue;
        if (t.indexOf('{') < 0 || !node.parentNode || rubySkip(node.parentNode)) return;
        RUBY_RE.lastIndex = 0;
        if (!RUBY_RE.test(t)) return;
        RUBY_RE.lastIndex = 0;
        const frag = document.createDocumentFragment();
        let last = 0, m;
        while ((m = RUBY_RE.exec(t))) {
            if (m.index > last) frag.appendChild(document.createTextNode(t.slice(last, m.index)));
            const ruby = document.createElement('ruby');
            ruby.appendChild(document.createTextNode(m[1]));
            const rt = document.createElement('rt');
            rt.textContent = m[2];
            ruby.appendChild(rt);
            frag.appendChild(ruby);
            last = m.index + m[0].length;
        }
        if (last < t.length) frag.appendChild(document.createTextNode(t.slice(last)));
        node.parentNode.replaceChild(frag, node);
    }
    function rubify(root) {
        if (root.nodeType === 3) return rubifyText(root);
        if (root.nodeType !== 1 || rubySkip(root)) return;
        const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const list = [];
        while (w.nextNode()) if (w.currentNode.nodeValue.indexOf('{') >= 0) list.push(w.currentNode);
        list.forEach(rubifyText);
    }
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(rubify)))

    const SONGS = [
        { n: '🏺 古代の うた', ys: [57, 239, 593, 604, 607, 645, 701, 710, 743, 752] },

    const byYear = y => ITEMS.find(i => i.y === y);

    // かな1文字を 1拍に。小さい かなと のばす ぼうは 前に くっつける
    const SMALL = 'ゃゅょぁぃぅぇぉゎっーゝ';
    function moraList(s) {
        const out = [];
        for (const ch of s) {
            if (out.length && SMALL.indexOf(ch) >= 0) out[out.length - 1] += ch;
            else out.push(ch);
        }
        return out;
    }
    // 年号の かっこを 目立たせる
    const dispHTML = d => esc(d).replace(/（([^（）]*)）/g,
        '<span class="num text-red-600">（$1）</span>');

    const TABS = { sing: '🎤 うたう', book: '🖼️ 図鑑', quiz: '🎯 クイズ', who: '👑 人物' };

    /* =====================================================================
       ① うたう（メロディを その場で 合成する）
       ===================================================================== */
    const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];  // C長音階の 5音
    const PATTERN = [0, 0, 1, 2, 2, 1, 0, 2, 3, 2, 1, 0, 1, 2, 3, 4];
    const TEMPOS = [['ゆっくり', 88], ['ふつう', 108], ['はやい', 132]];
    let songI = 0, bpm = 108, sound = true;
    let ctx = null, master = null, timeline = null, raf = 0, t0 = 0, playing = false;
    let stGoro = -1, stMora = -2, stYear = -2;

    function ensureCtx() {
        if (ctx) return ctx;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.5;
        master.connect(ctx.destination);
        return ctx;
    }
    function beep(t, freq, dur, type, gain) {
        if (!ctx) return;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type || 'triangle';
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(gain || 0.2, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.05);
    }

    // うたの 時間わりを つくる（音を 出さなくても これで 光らせる）
    function buildTimeline(song, bpm) {
        const beat = 30 / bpm;                 // 8分音符の 長さ（秒）
        const ev = [];
        let t = 0;
        song.ys.forEach((y, gi) => {
            const it = byYear(y);
            const mor = moraList(it.s);
            ev.push({ t, type: 'goro', gi, y });
            mor.forEach((m, i) => {
                ev.push({ t, type: 'mora', gi, i, m, f: SCALE[PATTERN[i % PATTERN.length]], dur: beat });
                t += beat;
            });
            t += beat;                          // ひとやすみ
            ev.push({ t, type: 'year', gi, y });
            t += beat * 4;
        });
        return { ev, dur: t, mora: ev.filter(e => e.type === 'mora').length };
    }
    function scheduleAudio(tl, at) {
        tl.ev.forEach(e => {
            if (e.type === 'mora') beep(at + e.t, e.f, e.dur * 0.9, 'triangle', 0.2);
            if (e.type === 'goro') beep(at + e.t, SCALE[0] / 2, 0.5, 'sine', 0.24);
            if (e.type === 'year') {
                [0, 1, 2].forEach(k => beep(at + e.t + k * 0.13, SCALE[3 + k], 0.18, 'square', 0.14));
            }
        });
    }
    function drawSongList() {
        document.getElementById('so-list').innerHTML = SONGS.map((s, i) =>
            `<button onclick="pickSong(${i})" data-song="${i}" class="${songI === i ? 'bg-orange-700 text-white' : 'bg-white border-2 border-amber-200 text-slate-600'} font-black px-3 py-1.5 rounded-full text-xs bounce-hover">${s.n} <span class="num opacity-80">${s.ys.length}</span></button>`).join('');
        document.getElementById('so-tempo').innerHTML = TEMPOS.map(([n, v]) =>
            `<button onclick="setBpm(${v})" data-bpm="${v}" class="${bpm === v ? 'bg-slate-700 text-white' : 'bg-white border-2 border-slate-200 text-slate-500'} font-black px-2.5 py-2 rounded-xl text-xs bounce-hover">${n}</button>`).join('');
        document.getElementById('so-snd').className = sound
            ? 'bg-emerald-600 text-white font-black px-3 py-2 rounded-xl text-sm bounce-hover'
            : 'bg-white border-2 border-slate-200 text-slate-500 font-black px-3 py-2 rounded-xl text-sm bounce-hover';
        document.getElementById('so-snd').innerText = sound ? '🔊 音 あり' : '🔇 音 なし';
        document.getElementById('so-items').innerHTML = SONGS[songI].ys.map(y => {
            const it = byYear(y);
            return `<div class="flex items-start gap-2 border-l-4 border-orange-300 pl-2 py-1" data-si="${y}">
                <span class="text-lg shrink-0">${it.e}</span>
                <span class="num font-black text-sm w-12 shrink-0 text-red-700">${it.y}</span>
                <div class="min-w-0">
                    <p class="font-black text-sm leading-snug">${dispHTML(it.d)}</p>
                    <p class="text-xs font-bold text-slate-500 leading-snug">${it.ev}</p>
                </div>
            </div>`;
        }).join('');
    }
    function pickSong(i) { stopSong(); songI = i; drawSongList(); showGoro(0, -1); }
    function setBpm(v) { const was = playing; stopSong(); bpm = v; drawSongList(); if (was) togglePlay(); }
    function toggleSound() {
        sound = !sound;
        drawSongList();
        if (playing) { const i = songI; stopSong(); songI = i; togglePlay(); }
    }
    function showGoro(gi, moraAt) {
        const song = SONGS[songI], y = song.ys[gi], it = byYear(y);
        const mor = moraList(it.s);
        document.getElementById('ka-emoji').innerText = it.e;
        document.getElementById('ka-era').innerText = `${it.era}　${gi + 1} / ${song.ys.length}`;
        document.getElementById('ka-event').innerHTML = it.ev;
        document.getElementById('ka-disp').innerHTML = dispHTML(it.d);
        document.getElementById('ka-lyric').innerHTML = mor.map((m, i) =>
            `<span class="mora ${i === moraAt ? 'on' : (moraAt >= 0 && i < moraAt ? 'done' : '')}" data-m="${i}">${esc(m)}</span>`).join('');
        const ball = document.getElementById('ka-ball');
        if (moraAt >= 0) {
            const el = document.querySelector(`[data-m="${moraAt}"]`);
            const host = document.getElementById('ka-lyric');
            if (el && host) {
                ball.style.left = (el.offsetLeft + el.offsetWidth / 2 - 10) + 'px';
                ball.style.top = (el.offsetTop - 22) + 'px';
                ball.style.opacity = '1';
            }
        } else ball.style.opacity = '0';
    }
    function showYear(gi) {
        const it = byYear(SONGS[songI].ys[gi]);
        const el = document.getElementById('ka-year');
        el.innerText = it.y;
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');
    }
    function togglePlay() {
        if (playing) { stopSong(); return; }
        timeline = buildTimeline(SONGS[songI], bpm);
        if (sound) { ensureCtx(); if (ctx) { if (ctx.state === 'suspended') ctx.resume(); scheduleAudio(timeline, ctx.currentTime + 0.12); } }
        t0 = performance.now() + 120;
        playing = true;
        resetAdvance();
        document.getElementById('so-play').innerText = '⏸ とめる';
        document.getElementById('ka-year').innerText = '';
        tick();
    }
    function stopSong() {
        playing = false;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        if (ctx) { try { master.gain.setTargetAtTime(0, ctx.currentTime, 0.02); } catch (e) { } }
        if (ctx) setTimeout(() => { try { master.gain.setTargetAtTime(0.5, ctx.currentTime, 0.02); } catch (e) { } }, 60);
        const pb = document.getElementById('so-play');
        if (pb) pb.innerText = '▶ うたう';
        document.getElementById('ka-bar').style.width = '0%';
        document.getElementById('ka-pos').innerText = '';
        document.getElementById('ka-ball').style.opacity = '0';
    }
    // 時間を 見て 画面を 進める（音が なくても 同じ うごき）
    function resetAdvance() { stGoro = -1; stMora = -2; stYear = -2; }
    function advance(el) {
        const tl = timeline;
        if (!tl) return false;
        let gi = 0, moraAt = -1, yearGi = -1;
        for (const e of tl.ev) {
            if (e.t > el) break;
            if (e.type === 'goro') { gi = e.gi; moraAt = -1; }
            if (e.type === 'mora') { gi = e.gi; moraAt = e.i; }
            if (e.type === 'year') yearGi = e.gi;
        }
        if (gi !== stGoro || moraAt !== stMora) { showGoro(gi, moraAt); stGoro = gi; stMora = moraAt; }
        // 年号は「いまの ゴロの 歌い終わり」だけ 出す（つぎの ゴロが 始まると 消える）
        const wantYear = yearGi === gi ? gi : -1;
        if (wantYear !== stYear) {
            stYear = wantYear;
            if (wantYear >= 0) showYear(wantYear);
            else document.getElementById('ka-year').innerText = '';
        }
        document.getElementById('ka-bar').style.width = Math.min(100, (el / tl.dur) * 100).toFixed(1) + '%';
        document.getElementById('ka-pos').innerText = `${el.toFixed(1)} / ${tl.dur.toFixed(1)} びょう`;
        return el < tl.dur;
    }
    function tick() {
        if (!playing) return;
        const el = (performance.now() - t0) / 1000;
        if (el >= 0 && !advance(el)) { stopSong(); return; }
        raf = requestAnimationFrame(tick);
    }

        }).join('');
        const list = ITEMS.filter(i =>

       ③ クイズ
       ===================================================================== */
    let qz = null;
    function newQuiz() {
        const it = pickOne(ITEMS);
        const kind = rnd(3);
        let ask, head, ans, choices;
        if (kind === 0) {
            ask = 'この ゴロ合わせは 何年？';
            head = `<p class="font-black text-lg sm:text-2xl leading-relaxed">${dispHTML(it.d.replace(/（[^（）]*）/g, '（？）'))}</p>
                    <p class="text-3xl mt-1">${it.e}</p>`;
            ans = String(it.y);
            const near = shuffle(ITEMS.filter(x => x.y !== it.y)).sort((a, b) => Math.abs(a.y - it.y) - Math.abs(b.y - it.y)).slice(0, 6);
            choices = shuffle([ans].concat(shuffle(near).slice(0, 3).map(x => String(x.y))));
        } else if (kind === 1) {
            ask = 'この 年に あった できごとは？';
            head = `<p class="num text-4xl sm:text-6xl font-black text-red-700">${it.y}</p>`;
            ans = it.ev;
            choices = shuffle([ans].concat(shuffle(ITEMS.filter(x => x.y !== it.y)).slice(0, 3).map(x => x.ev)));
        } else {
            ask = 'この できごとの ゴロ合わせは どれ？';
            head = `<p class="num text-2xl font-black text-red-700">${it.y}</p>
                    <p class="font-bold text-sm mt-1">${it.ev}</p>`;
            ans = it.d;
            choices = shuffle([ans].concat(shuffle(ITEMS.filter(x => x.y !== it.y)).slice(0, 3).map(x => x.d)));
        }
        qz = { it, kind, ans, choices, done: false };
        document.getElementById('qz-ask').innerText = ask;
        document.getElementById('qz-head').innerHTML = head;
        document.getElementById('qz-choices').innerHTML = choices.map((c, i) =>
            `<button onclick="ansQuiz(${i})" data-qzc="${i}" class="bg-white border-2 border-slate-200 hover:border-orange-500 font-bold text-left px-4 py-3 rounded-2xl bounce-hover text-sm leading-relaxed">${kind === 0 ? `<span class="num font-black text-lg">${esc(c)}</span> 年` : dispHTML(c)}</button>`).join('');
        document.getElementById('qz-res').innerHTML = '';
        document.getElementById('qz-score').innerText = `${S.quiz[0]} / ${S.quiz[1]}`;
    }
    function ansQuiz(i) {
        if (!qz || qz.done) return;
        qz.done = true;
        const ok = qz.choices[i] === qz.ans;
        S.quiz[1]++; if (ok) S.quiz[0]++;
        document.querySelectorAll('[data-qzc]').forEach((el, j) => {
            const isR = qz.choices[j] === qz.ans;
            el.className = `${isR ? 'bg-green-50 border-green-500' : (j === i ? 'bg-red-50 border-red-400 shake' : 'bg-white border-slate-200 opacity-60')} border-2 font-bold text-left px-4 py-3 rounded-2xl text-sm leading-relaxed`;
        });
        const it = qz.it;
        document.getElementById('qz-res').innerHTML = resultBox(ok, ok ? '⭕ せいかい！' : '❌ ざんねん…',
            `<p class="text-2xl">${it.e} <span class="num text-red-700">${it.y}</span>　<span class="text-xs text-slate-400">${it.era}</span></p>
             <p class="font-black mt-1">${dispHTML(it.d)}</p>
             <p class="mt-1">${it.ev}</p>`);
        document.getElementById('qz-score').innerText = `${S.quiz[0]} / ${S.quiz[1]}`;
    }
